<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Колыбельная — вступление</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,700;1,800;1,900&family=Roboto+Condensed:wght@400;500;700&display=swap">
<style>
/* Stage 2560x1440 scaled to fit; ultrawide sides get the current picture blurred. Crio palette, softened. */
:root {
  --ink: #070b14; --ink2: #0f1726; --paper: #eef6ff; --mute: #8798b0;
  --acid: #6cf0ff; --violet: #7b5cff; --amber: #ffb320;
  --display: "Montserrat", "Segoe UI", sans-serif;
  --cond: "Roboto Condensed", "Bahnschrift", "Arial Narrow", sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
body { font-family: var(--cond); color: var(--paper); cursor: pointer; user-select: none; }
#bgblur { position: fixed; inset: -60px; background-size: cover; background-position: center; filter: blur(48px) brightness(.45) saturate(1.1); transition: background-image .6s; }
#vignette { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(7,11,20,.85) 100%); pointer-events: none; }
#stage { position: absolute; left: 50%; top: 50%; width: 2560px; height: 1440px; transform-origin: 0 0; overflow: hidden; background: var(--ink); box-shadow: 0 0 120px rgba(0,0,0,.8); }
.slide { position: absolute; inset: 0; opacity: 0; transition: opacity .55s ease; }
.slide.on { opacity: 1; }
.full img, .panel img, .bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph { position: absolute; inset: 0; display: grid; place-items: center; font: 600 34px var(--cond); color: var(--mute); letter-spacing: .1em; text-transform: uppercase; text-align: center; padding: 120px; background: repeating-linear-gradient(-30deg, #0d1424 0 40px, #101a2e 40px 80px); }
.kb { animation: kb 14s ease-out forwards; }
@keyframes kb { from { transform: scale(1.0); } to { transform: scale(1.06); } }

/* comic: diagonal panels, ink gutters */
.comic { background: var(--ink); }
.panel { position: absolute; inset: 0; overflow: hidden; transition: filter .7s ease, opacity .7s ease; }
.panel.hidden { filter: blur(26px) brightness(.35) saturate(.6); }
.panel.shown img { animation: kb 10s ease-out forwards; }
.panel .cap { position: absolute; }
.gutter { position: absolute; inset: 0; pointer-events: none; }

/* captions and subtitles — Pop language, softened */
.cap { max-width: 760px; background: rgba(15,23,38,.86); border-left: 6px solid var(--acid); padding: 18px 26px; transform: skewX(-8deg); font: 500 34px/1.35 var(--cond); box-shadow: 10px 10px 0 rgba(123,92,255,.35); opacity: 0; transition: opacity .5s .25s; }
.cap > span { display: block; transform: skewX(8deg); }
.panel.shown .cap { opacity: 1; }
#sub { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); width: 1900px; text-align: center; pointer-events: none; }
#sub .who { display: inline-block; font: italic 800 30px var(--display); letter-spacing: .06em; color: var(--ink); background: var(--acid); padding: 4px 22px; transform: skewX(-12deg); margin-bottom: 14px; }
#sub .who.big { background: var(--amber); }
#sub .line { font: 500 52px/1.32 var(--cond); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.85), 0 0 26px rgba(0,0,0,.9); }
#sub .line.caption { font-style: italic; color: var(--paper); }
#sub::before { content: ""; position: absolute; left: -330px; right: -330px; bottom: -70px; height: 360px; background: linear-gradient(to top, rgba(7,11,20,.92), transparent); z-index: -1; }

/* title card */
.title { display: grid; place-items: center; background: radial-gradient(ellipse at center, #13213a 0%, var(--ink) 70%); }
.title h1 { font: italic 900 220px/.9 var(--display); margin: 0; letter-spacing: -.02em; color: var(--paper); text-shadow: 14px 14px 0 var(--violet); }
.title p { font: 600 40px var(--cond); letter-spacing: .5em; color: var(--acid); text-align: center; margin: 30px 0 0; }
.chapter { position: absolute; left: 140px; top: 120px; font: italic 800 64px var(--display); color: var(--paper); background: rgba(7,11,20,.7); padding: 10px 36px; transform: skewX(-10deg); border-left: 10px solid var(--amber); }

/* crew dossier on the capsule panel: their own card art, cooled to sleep */
.crew { position: absolute; top: 15%; transform: translateX(-50%); display: flex; gap: 22px; opacity: 0; transition: opacity .6s .35s; }
.panel.shown .crew { opacity: 1; }
.crew figure { margin: 0; width: 220px; transform: skewX(-6deg); background: var(--ink2); border: 3px solid var(--acid); box-shadow: 8px 8px 0 rgba(123,92,255,.45); }
.crew figure img { position: static; display: block; width: 100%; height: 253px; object-fit: cover; filter: saturate(.75) hue-rotate(-8deg) brightness(.92); }
.crew figcaption { font: italic 800 20px var(--display); color: var(--ink); background: var(--acid); padding: 4px 10px; letter-spacing: .04em; }
.crew figcaption::after { content: " · КРИОСОН"; font: 600 14px var(--cond); color: var(--ink2); letter-spacing: .1em; }

/* novel sprite */
.sprite { position: absolute; right: 120px; bottom: 0; height: 1300px; filter: drop-shadow(0 0 40px rgba(108,240,255,.25)); }

/* UI chrome */
#hud { position: fixed; right: 24px; bottom: 18px; display: flex; gap: 10px; font: 500 15px var(--cond); color: var(--mute); z-index: 5; }
#hud button { font: 600 14px var(--cond); color: var(--paper); background: rgba(15,23,38,.8); border: 1px solid #2a3a55; padding: 6px 12px; cursor: pointer; letter-spacing: .06em; }
#hud button.on { border-color: var(--acid); color: var(--acid); }
#prog { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--acid); transition: width .4s; z-index: 5; }
#hint { position: fixed; left: 24px; bottom: 18px; font: 500 15px var(--cond); color: var(--mute); letter-spacing: .08em; z-index: 5; }
@media (prefers-reduced-motion: reduce) { .kb, .panel.shown img { animation: none; } .slide, .panel, .cap { transition: none; } }
</style>
</head>
<body>
<div id="bgblur"></div><div id="vignette"></div>
<div id="stage"><div id="slides"></div>
  <div id="sub"><div class="who" id="who" hidden></div><div class="line" id="line"></div></div>
</div>
<div id="prog"></div>
<div id="hint">КЛИК / ПРОБЕЛ — ДАЛЬШЕ · ← НАЗАД · ESC — ПРОПУСТИТЬ</div>
<div id="hud"><button id="auto" type="button">АВТО</button><button id="skip" type="button">ПРОПУСТИТЬ</button></div>
<script src="img/map.js" onerror="window.INTRO_IMG={}"></script>
<script src="story.js"></script>
<script>
// ---- layout: fit the 2560x1440 stage into the window
const stage = document.getElementById("stage");
function fit() { const k = Math.min(innerWidth / 2560, innerHeight / 1440); stage.style.transform = `translate(${-1280 * k}px, ${-720 * k}px) scale(${k})`; }
addEventListener("resize", fit); fit();

// comic layouts: polygons in % of the stage, with ink gutters drawn over them
const LAYOUTS = {
  diag3: [ "0 0, 44% 0, 34% 100%, 0 100%", "45.2% 0, 70% 0, 60% 100%, 35.2% 100%", "71.2% 0, 100% 0, 100% 100%, 61.2% 100%" ],
  diag3h: [ "0 0, 100% 0, 100% 34%, 0 46%", "0 47.5%, 100% 35.5%, 100% 66%, 0 74%", "0 75.5%, 100% 67.5%, 100% 100%, 0 100%" ],
  big2: [ "0 0, 62% 0, 50% 100%, 0 100%", "63.2% 0, 100% 0, 100% 100%, 51.2% 100%" ],
};
// each panel shows the middle of its own picture: the panel's centre (in % of the stage)
const CENTERS = { diag3: [[19, 50], [52, 50], [83, 50]], diag3h: [[50, 20], [50, 55], [50, 86]], big2: [[28, 50], [77, 50]] };

const slidesEl = document.getElementById("slides"), who = document.getElementById("who"), line = document.getElementById("line");
let si = 0, step = 0, auto = false, timer = null;
const S = window.STORY;

function img(src, label) { if (src) { const i = new Image(); i.src = src; i.alt = ""; i.draggable = false; return i; } const d = document.createElement("div"); d.className = "ph"; d.textContent = label || ""; return d; }

function build(s) {
  const el = document.createElement("div"); el.className = "slide " + s.type;
  if (s.type === "full" || s.type === "novel") {
    const i = img(s.img, s.alt); i.classList.add("bgimg", "kb"); el.append(i);
    if (s.chapter) { const c = document.createElement("div"); c.className = "chapter"; c.textContent = s.chapter; el.append(c); }
    if (s.sprite) { const sp = img(s.sprite); sp.className = "sprite"; el.append(sp); }
  } else if (s.type === "comic") {
    const polys = LAYOUTS[s.layout];
    s.panels.forEach((p, k) => {
      const pd = document.createElement("div"); pd.className = "panel hidden"; pd.style.clipPath = `polygon(${polys[k]})`;
      const i = img(p.img, p.alt); const [cx, cy] = CENTERS[s.layout][k];
      if (i.tagName === "IMG") Object.assign(i.style, { width: "100%", height: "100%", left: (cx - 50) + "%", top: (cy - 50) + "%", inset: "auto" });
      pd.append(i);
      if (p.crew) {
        const row = document.createElement("div"); row.className = "crew"; row.style.left = cx + "%";
        p.crew.forEach(([src, name]) => { const f = document.createElement("figure"); const im = img(I(src)); f.append(im); const cpt = document.createElement("figcaption"); cpt.textContent = name; f.append(cpt); row.append(f); });
        pd.append(row);
      }
      if (p.cap) { const c = document.createElement("div"); c.className = "cap"; Object.assign(c.style, p.capAt || { left: "8%", top: "8%" }); const sp = document.createElement("span"); sp.textContent = p.cap; c.append(sp); pd.append(c); }
      el.append(pd);
    });
  } else if (s.type === "title") {
    el.innerHTML = `<div><h1>${s.title}</h1><p>${s.sub || ""}</p></div>`;
  }
  return el;
}
const built = S.map(build); built.forEach(b => slidesEl.append(b));

// a slide's steps: comic = one step per panel (each may carry lines); others = one step per line
function steps(s) { return s.type === "comic" ? s.panels.map(p => p.lines || []) : (s.lines || [[]]).map(l => [l]); }
function bgOf(s, k) { if (s.type === "comic") return s.panels[Math.min(k, s.panels.length - 1)].img; return s.img; }

function show() {
  const s = S[si], st = steps(s);
  built.forEach((b, i) => b.classList.toggle("on", i === si));
  if (s.type === "comic") built[si].querySelectorAll(".panel").forEach((p, k) => { p.classList.toggle("hidden", k > step); p.classList.toggle("shown", k <= step); });
  const bg = bgOf(s, step); document.getElementById("bgblur").style.backgroundImage = bg ? `url("${bg}")` : "none";
  const cur = (st[step] || [])[0] || null;
  if (cur && cur.t) { who.hidden = !cur.who; who.textContent = cur.who || ""; who.className = "who" + (cur.big ? " big" : ""); line.textContent = cur.t; line.className = "line" + (cur.who ? "" : " caption"); }
  else { who.hidden = true; line.textContent = ""; }
  const total = S.reduce((a, x) => a + steps(x).length, 0), done = S.slice(0, si).reduce((a, x) => a + steps(x).length, 0) + step + 1;
  document.getElementById("prog").style.width = (100 * done / total) + "%";
  schedule(cur);
}
function lineAt() { const st = steps(S[si]); return (st[step] || [])[0]; }
function schedule(cur) { clearTimeout(timer); if (!auto) return; const t = cur && cur.t ? cur.t.length : 0; timer = setTimeout(next, Math.max(2600, 1400 + t * 70)); }
function next() {
  const s = S[si], st = steps(s);
  // comic: a panel can carry several lines — walk lines inside the panel first
  const pl = s.type === "comic" ? s.panels[step].lines || [] : null;
  if (pl && pl.length > 1 && (S._li = (S._li || 0) + 1) < pl.length) { const c = pl[S._li]; who.hidden = !c.who; who.textContent = c.who || ""; who.className = "who" + (c.big ? " big" : ""); line.textContent = c.t; line.className = "line" + (c.who ? "" : " caption"); schedule(c); return; }
  S._li = 0;
  if (step + 1 < st.length) { step++; show(); return; }
  if (si + 1 < S.length) { si++; step = 0; show(); return; }
  finish();
}
function prev() { S._li = 0; if (step > 0) { step--; show(); return; } if (si > 0) { si--; step = steps(S[si]).length - 1; show(); } }
function finish() { clearTimeout(timer); line.textContent = "Конец вступления — дальше игра."; who.hidden = true; }
addEventListener("click", e => { if (e.target.closest("#hud")) return; next(); });
addEventListener("keydown", e => { if (e.key === " " || e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); next(); } else if (e.key === "ArrowLeft") prev(); else if (e.key === "Escape") { si = S.length - 1; step = steps(S[si]).length - 1; show(); } });
document.getElementById("auto").onclick = () => { auto = !auto; document.getElementById("auto").classList.toggle("on", auto); schedule(lineAt()); };
document.getElementById("skip").onclick = () => { si = S.length - 1; step = steps(S[si]).length - 1; show(); };
// a direct link to a frame: #s=5 (all of its panels open) — for reviewing
{ const m = /s=(\d+)/.exec(location.hash); if (m) { si = Math.min(S.length - 1, +m[1]); step = steps(S[si]).length - 1; } }
show();
</script>
</body>
</html>
